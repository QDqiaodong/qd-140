services:
  mysql:
    image: ${DOCKER_REGISTRY}mysql:8.0
    container_name: qd-140-mysql
    ports:
      - "${MYSQL_HOST}:${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: "1"
      TZ: ${TZ}
      LANG: ${LANG}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --character-set-client-handshake=false
      - --init-connect=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend/sql/migration_plan_attachment.sql:/docker-entrypoint-initdb.d/02-migration_plan_attachment.sql:ro
      - ./backend/sql/migration_training_session.sql:/docker-entrypoint-initdb.d/03-migration_training_session.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: ${DOCKER_REGISTRY}redis:7-alpine
    container_name: qd-140-redis
    ports:
      - "${REDIS_HOST}:${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
        BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT}
    image: qd-140-backend
    container_name: qd-140-backend
    ports:
      - "${BACKEND_HOST}:${BACKEND_PORT}:${BACKEND_INTERNAL_PORT}"
    environment:
      SERVER_PORT: "${BACKEND_INTERNAL_PORT}"
      TZ: "${TZ}"
      LANG: "${LANG}"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci"
      SPRING_DATASOURCE_USERNAME: "rowing_user"
      SPRING_DATASOURCE_PASSWORD: "rowing_pass"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_REDIS_HOST: "redis"
      SPRING_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      SPRING_REDIS_PASSWORD: "rowing_redis"
      ROWING_PLAN_DIR: "/app/uploads/plans"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - plan_files:/app/uploads/plans
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY}
    image: qd-140-frontend
    container_name: qd-140-frontend
    ports:
      - "${FRONTEND_HOST}:${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:
  redis_data:
  plan_files:

networks:
  app-network:
    driver: bridge
